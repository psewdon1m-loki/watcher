# Watcher routes for the host nginx site:
#   /etc/nginx/sites-available/loki
#
# Include this file from the HTTPS `server {}` block. TLS, certificate renewal,
# the port-80 redirect and PasarGuard's own locations remain owned by the host.

client_max_body_size 300m;
client_body_timeout 30s;
client_header_timeout 15s;
keepalive_timeout 30s;
send_timeout 60s;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Replace untrusted forwarding data instead of appending to it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location = /health {
    proxy_pass http://127.0.0.1:18080;
}

location = /manifest.json {
    proxy_pass http://127.0.0.1:18080;
}

location = /manifest.json.sig {
    proxy_pass http://127.0.0.1:18080;
}

location ^~ /assets/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Keep this prefix narrow. PasarGuard continues to own /api/user/... in the
# same `loki` site configuration.
location ^~ /api/v1/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Subscription tokens are bearer credentials and must never enter access logs.
location ^~ /sub/ {
    access_log off;
    proxy_pass http://127.0.0.1:18080;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
}

location = / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://127.0.0.1:18081;
}

location = /app.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://127.0.0.1:18081;
}

location = /styles.css {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    proxy_pass http://127.0.0.1:18081;
}

location / {
    proxy_pass http://127.0.0.1:18081;
}
