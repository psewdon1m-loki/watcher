name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned and hashed dependencies
        run: >-
          pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Audit Python dependency advisories
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt
          require-hashes: true
      - name: Validate entry points
        run: |
          bash -n deploy/bootstrap.sh deploy/install.sh deploy/watcherctl
          python -m py_compile api/app.py common/backup_contract.py common/database_lock.py worker/worker.py worker/backup.py deploy/validate_env.py deploy/recovery_tool.py deploy/updater_common.py deploy/local_updater.py deploy/updater_daemon.py deploy/updater_client.py deploy/updater_self_update.py scripts/build_release.py scripts/verify_repository.py
          node --check web/static/app.js
          python scripts/verify_repository.py
      - name: Scan source, configuration and dependency files
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
      - name: Run suites
        run: |
          python -m unittest discover -s api/tests -v
          (cd worker && PYTHONPATH=.. python -m unittest test_worker.py -v)
          python -m unittest discover -s deploy/tests -v
      - name: Validate Compose
        env:
          LOKI_WATCHER_DASHBOARD_USERNAME: ci-operator
          LOKI_WATCHER_DASHBOARD_PASSWORD: CI-Strong-Password-12345!
          LOKI_WATCHER_BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LOKI_WATCHER_LOCAL_CONTROL_TOKEN: ci-control-token-abcdefghijklmnopqrstuvwxyz
          LOKI_WATCHER_VERSION: 0.1.0
          LOKI_WATCHER_API_IMAGE: ghcr.io/example/watcher-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          LOKI_WATCHER_WEB_IMAGE: ghcr.io/example/watcher-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          LOKI_WATCHER_WORKER_IMAGE: ghcr.io/example/watcher-worker@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          LOKI_WATCHER_UPDATER_GID: "999"
          LOKI_WATCHER_PUBLIC_SNI: watcher.example.test
        run: |
          docker compose config --quiet
          docker compose -f deploy/docker-compose.release.yml config --quiet
      - name: Build and health-smoke local containers
        env:
          LOKI_WATCHER_DASHBOARD_USERNAME: ci-operator
          LOKI_WATCHER_DASHBOARD_PASSWORD: CI-Strong-Password-12345!
          LOKI_WATCHER_BACKUP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          LOKI_WATCHER_LOCAL_CONTROL_TOKEN: ci-control-token-abcdefghijklmnopqrstuvwxyz
          LOKI_WATCHER_API_PORT: "18080"
          LOKI_WATCHER_WEB_PORT: "18081"
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:18080/health && break; sleep 2; done
          curl --fail --silent http://127.0.0.1:18080/health
          curl --fail --silent http://127.0.0.1:18081/ >/dev/null
          docker compose ps
      - name: Bounded failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail 100 api web worker backup
      - name: Stop smoke stack
        if: always()
        run: docker compose down

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
        with:
          languages: python,javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@6d786de4d6f3531a740e445b53a42b622bbbace8 # v3
