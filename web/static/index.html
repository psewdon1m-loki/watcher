<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loki Watcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginScreen" class="loginScreen">
    <h1>LOKI WATCHER</h1>
    <div class="loginPanel">
      <input id="username" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="username">
      <input id="password" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" placeholder="password">
      <button id="login" type="button">sign in</button>
      <p id="loginStatus" class="statusLine"></p>
    </div>
  </section>

  <main id="appScreen" class="shell hidden">
    <header class="top">
      <h1>LOKI WATCHER</h1>
    </header>

    <section class="sectionTop">
      <h2>Dashboard</h2>
      <div class="actions">
        <button id="requestData" type="button">request data</button>
        <button id="downloadBackup" type="button">create backup</button>
        <label class="uploadButton">
          restore backup
          <input id="uploadBackup" type="file" accept=".zip,application/zip">
        </label>
        <button id="refresh" type="button">refresh</button>
      </div>
    </section>
    <p id="status" class="statusLine"></p>
    <section id="dashboard" class="summary"></section>

    <section class="sectionTop second">
      <h2>Updates</h2>
    </section>
    <section id="updates" class="targetPanel"></section>

    <section class="sectionTop second">
      <h2>Clients</h2>
    </section>
    <section id="clients" class="clients"></section>
    <section id="detail" class="detail hidden"></section>

    <div id="contextMenu" class="contextMenu hidden">
      <button id="deleteClient" type="button">delete client</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
